serenity {
    project.name = "SauceDemo E2E - Flujo de compra"
    take.screenshots = FOR_EACH_ACTION
    restart.browser.for.each = scenario
    logging = VERBOSE
}

# Por defecto se ejecuta sin interfaz grafica; usar -Dheadless.mode=false para ver el navegador
headless.mode = true

webdriver {
  driver = chrome
  timeouts {
    implicitlywait = 5000
    fluentwait = 10000
  }
  capabilities {
    browserName = "chrome"
    acceptInsecureCerts = true
    "goog:chromeOptions" {
      args = ["remote-allow-origins=*", "test-type", "no-sandbox", "ignore-certificate-errors",
        "--window-size=1440,900", "incognito", "disable-infobars", "disable-gpu", "disable-default-apps",
        "disable-popup-blocking", "disable-dev-shm-usage", "disable-extensions", "disable-translate",
        "disable-notifications"]
      # Evita el dialogo de Chrome "cambia tu contrasena" (secret_sauce aparece en filtraciones publicas)
      prefs {
        credentials_enable_service = false
        "profile.password_manager_enabled" = false
        "profile.password_manager_leak_detection" = false
      }
    }
  }
}

environments {
  default {
    webdriver.base.url = "https://www.saucedemo.com"
  }
}
