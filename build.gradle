buildscript {
    repositories {
        mavenCentral()
    }
    dependencies {
        classpath 'net.serenity-bdd:serenity-single-page-report:5.3.9'
    }
}

plugins {
    id 'java'
    id 'idea'
    id 'net.serenity-bdd.serenity-gradle-plugin' version '5.3.9'
}

group = 'com.sofka'
version = '1.0.0'

defaultTasks 'clean', 'test', 'aggregate'

repositories {
    mavenCentral()
}


ext {
    serenityVersion = '5.3.9'
    junitVersion = '6.0.3'
    cucumberVersion = '7.34.2'
    logbackVersion = '1.6.5'
}

dependencies {
    // main: componentes Screenplay reutilizables (tasks, questions, userinterfaces, models)
    implementation platform("net.serenity-bdd:serenity-bom:${serenityVersion}")
    implementation 'net.serenity-bdd:serenity-core'
    implementation 'net.serenity-bdd:serenity-screenplay'
    implementation 'net.serenity-bdd:serenity-screenplay-webdriver'

    // test: runners, step definitions y validaciones
    testImplementation platform("net.serenity-bdd:serenity-bom:${serenityVersion}")
    testImplementation 'net.serenity-bdd:serenity-cucumber'
    testImplementation 'net.serenity-bdd:serenity-ensure'

    testImplementation "io.cucumber:cucumber-junit-platform-engine:${cucumberVersion}"
    testImplementation "org.junit.platform:junit-platform-suite:${junitVersion}"
    testImplementation "org.junit.jupiter:junit-jupiter-engine:${junitVersion}"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher:${junitVersion}"

    testImplementation "ch.qos.logback:logback-classic:${logbackVersion}"
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 17
}

test {
    useJUnitPlatform()
    // Solo se ejecutan los runners del proyecto (ignora cualquier otro suite del classpath)
    filter {
        includeTestsMatching 'com.sofka.saucedemo.runners.*'
    }
    // Propaga propiedades -D (headless.mode, webdriver.driver, tags, etc.) a la JVM de pruebas
    systemProperties System.getProperties().findAll { k, v ->
        k.toString().startsWith('headless') || k.toString().startsWith('webdriver') ||
                k.toString().startsWith('serenity') || k.toString().startsWith('cucumber') ||
                k.toString() == 'environment' || k.toString().startsWith('saucedemo')
    }
    testLogging {
        events 'passed', 'skipped', 'failed'
        showStandardStreams = true
    }
    // El reporte de Serenity se genera aunque la prueba falle
    finalizedBy 'aggregate', 'reports'
}

serenity {
    reports = ['single-page-html']
}

gradle.startParameter.continueOnFailure = true
